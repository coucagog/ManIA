services:
  documents:
    build: .
    image: mania-documents
    container_name: mania-documents
    restart: unless-stopped
    networks: [ web ]              # REJOINT le réseau Traefik existant
    env_file: .env                 # SHARED_SERVICES_SECRET (LE MÊME que la transcription)
    labels:
      # Exposition publique — MÊME raison que la transcription (STACK-3.md §36) :
      # les agents (réseaux isolés) et Telegram y accèdent par URL publique ;
      # URL stable = future externalisation par simple repointage DNS.
      - "traefik.enable=true"
      - "traefik.http.routers.documents.rule=Host(`documents.mania.sn`)"
      - "traefik.http.routers.documents.entrypoints=websecure"
      - "traefik.http.routers.documents.tls=true"
      - "traefik.http.routers.documents.tls.certresolver=letsencrypt"
      - "traefik.http.services.documents.loadbalancer.server.port=8000"
      # ⚠️ Routeur `documents` (unique) — JAMAIS `mania` (collision = site cassé).
    mem_limit: 2g                  # OBLIGATOIRE — LibreOffice peut pointer à ~500 Mo/conversion
    cpus: 2                        # quota CPU

networks:
  web:
    external: true
