services:
  pii:
    build: .
    image: mania-pii
    container_name: mania-pii
    restart: unless-stopped
    networks: [web]

    # Le secret vit HORS du checkout git (STACK-4 §50) : `.env` est gitignore,
    # donc un `git clean -fdx` dans /opt/mania l'aurait supprime. Chemin absolu
    # sous /opt/hermes/, conforme a la convention des services partages.
    #   sudo install -d -m 700 /opt/hermes/pii
    #   sudo cp /opt/hermes/gabarit/.shared-services-secret -> SHARED_SERVICES_SECRET
    env_file: /opt/hermes/pii/.env

    environment:
      - UPSTREAM_BASE_URL=https://openrouter.ai/api/v1
      - PII_FAIL_CLOSED=1
      # PII_PROBE_MODE est volontairement ABSENT d'ici : il vient de
      # /opt/hermes/pii/.env, HORS du checkout git. Le basculer pour la sonde
      # ne salit donc pas le working tree — on ne reintroduit pas la "danse du
      # stash" (dette STACK-2 n°1, close au §51) pour un drapeau de debug.
      #   sudo sed -i 's/^PII_PROBE_MODE=.*/PII_PROBE_MODE=1/' /opt/hermes/pii/.env
      #   sudo docker compose up -d

    mem_limit: 1536m          # §16 estimait ~1 Go (spaCy small) ; a re-mesurer (§37).
    cpus: 2                   # VPS SANS SWAP : la limite protege mania-app et les agents.

    labels:
      - "traefik.enable=true"
      # /!\ Routeur nomme `pii` — unique. JAMAIS `mania` (collision qui casserait
      #     le site, STACK §10). Le DNS etant en *.mania.sn, un locataire sluggue
      #     `pii` entrerait en concurrence sur ce meme Host() : la liste des slugs
      #     reserves de nouveau-tenant.sh est la SEULE barriere (STACK-4 §50).
      - "traefik.http.routers.pii.rule=Host(`pii.mania.sn`)"
      - "traefik.http.routers.pii.entrypoints=websecure"
      - "traefik.http.routers.pii.tls=true"
      # /!\ `letsencrypt` — valeur utilisee par mania-app ET transcription.
      #     La v1 disait `le`, resolveur inexistant => aucun certificat emis.
      - "traefik.http.routers.pii.tls.certresolver=letsencrypt"
      - "traefik.http.services.pii.loadbalancer.server.port=8000"

networks:
  web:
    external: true   # reseau cree par Traefik, on ne fait que le rejoindre
