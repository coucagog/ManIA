services:
  transcription:
    build:
      context: .
      args:
        WHISPER_MODEL_SIZE: small
    image: mania-transcription
    container_name: mania-transcription
    restart: unless-stopped
    networks: [ web ]              # REJOINT le réseau Traefik existant, ne le recrée jamais
    env_file: .env                 # SHARED_SERVICES_SECRET — jamais en dur, 0600
    labels:
      # -------------------------------------------------------------------
      # EXPOSITION PUBLIQUE VOULUE — https://transcription.mania.sn
      #
      # Pourquoi public et pas interne (décision STACK-3.md §36) :
      #  1. Déclenché depuis le chat WebUI ET depuis Telegram. Telegram est géré
      #     par le conteneur AGENT, isolé sur le réseau du tenant (jamais sur
      #     `web`, STACK.md §13) : il ne peut joindre le service que par une URL
      #     publique, via son accès sortant (le même qui joint le LLM).
      #  2. Le service partira À TERME sur son propre VPS (Voxtral). Adresser une
      #     URL STABLE (transcription.mania.sn) rend cette migration = un simple
      #     repointage DNS, sans toucher un seul agent (principe §9 :
      #     "déménagement, pas refonte"). Un nom Docker interne casserait tout.
      #
      # Surface d'attaque maîtrisée : endpoint protégé par token HMAC 256 bits
      # par tenant + file d'attente bornée (pas d'épuisement de ressources).
      - "traefik.enable=true"
      - "traefik.http.routers.transcription.rule=Host(`transcription.mania.sn`)"
      - "traefik.http.routers.transcription.entrypoints=websecure"
      - "traefik.http.routers.transcription.tls=true"
      - "traefik.http.routers.transcription.tls.certresolver=letsencrypt"
      - "traefik.http.services.transcription.loadbalancer.server.port=8000"
      # ⚠️ Routeur nommé `transcription` (unique) — JAMAIS `mania` (collision qui
      #    casserait le site, STACK.md §10).
      # -------------------------------------------------------------------
    mem_limit: 2g                  # OBLIGATOIRE — protège mania-app + les 2 agents de l'OOM (VPS sans swap)
    cpus: 2                        # quota CPU — cf. STACK.md §10, contrainte #2

networks:
  web:
    external: true                 # réseau créé par Traefik, on ne fait que le rejoindre
