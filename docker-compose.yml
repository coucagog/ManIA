services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mania.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.mania.entrypoints=websecure"
      - "traefik.http.routers.mania.tls=true"
      - "traefik.http.routers.mania.tls.certresolver=letsencrypt"
      - "traefik.http.services.mania.loadbalancer.server.port=3000"
    environment:
      DATABASE_URL: "file:/data/prod.db"
      SESSION_SECRET: "${SESSION_SECRET}"
      NEXTAUTH_URL: "https://${DOMAIN}"
      NODE_ENV: "production"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      NEXT_PUBLIC_BASE_URL: "https://${DOMAIN}"
      CRON_SECRET: "${CRON_SECRET}"
      PROVISIONING_SECRET: "${PROVISIONING_SECRET}"
      # ... (garde tout ton contenu existant) ...
      # ▼ AJOUT : le MÊME secret que /opt/mania-provisiond/.env (PROVISIOND_SECRET).
      PROVISIOND_SECRET: "${PROVISIOND_SECRET}"
    volumes:
      - db_data:/data
      - uploads:/app/public/uploads
      # ▼ AJOUT : monter le DOSSIER du socket (pas le fichier) — l'ordre de
      #   démarrage n'importe plus, et le socket créé par le démon y apparaît.
      - /run/mania-provisiond:/run/mania-provisiond

networks:
  web:
    external: true   # réseau créé une fois par Traefik, partagé entre toutes les apps

volumes:
  db_data:
  uploads:
